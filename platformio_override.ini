# Example PlatformIO Project Configuration Override
# ------------------------------------------------------------------------------
# Copy to platformio_override.ini to activate overrides
# ------------------------------------------------------------------------------
# Please visit documentation: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = PixC_V1  # put the name(s) of your own build environment here. You can define as many as you need

[env:PixC_V1]
platform = ${esp32s3.platform}
platform_packages = ${esp32s3.platform_packages}
board = freenove_esp32_s3_wroom
custom_usermods = audioreactive pixc_connect_blink
upload_speed = 921600
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags} ${esp32s3.build_flags} ${esp32.AR_lib_deps} -D WLED_RELEASE_NAME=\"ESP32-S3_WROOM-1\"
  -D CONFIG_LITTLEFS_FOR_IDF_3_2 -D WLED_WATCHDOG_TIMEOUT=0
  ; Board uses an external USB-UART bridge (not the S3's native USB), so route
  ; Serial/debug to UART0 — CDC_ON_BOOT=1 sends it to native USB (nothing wired).
  -D ARDUINO_USB_CDC_ON_BOOT=0 -D ARDUINO_USB_MODE=1 -D WLED_DEBUG
  -DBOARD_HAS_PSRAM -D WLED_DISABLE_OTA
   ; PixC API host the device calls to fetch its MQTT broker (broker itself is
   ; NOT hardcoded — fetched from /api/v1/provision). Dev = Mac LAN IP; the app
   ; also provisions this over /json/cfg so a reflash isn't needed on IP change.
   -D WLED_DISABLE_HUESYNC
   -D WLED_DISABLE_LOXONE
   -D WLED_DISABLE_INFRARED
   -D WLED_DISABLE_WEBSOCKETS
   -D WLED_DISABLE_ADALIGHT
   ; WLED_DISABLE_2D was set here until 2026-08-25. It was believed to be expensive to change
   ; because flipping it would renumber every stored effect id — that was wrong (see the fork note
   ; in the vault): ids are pre-allocated, so a disabled effect leaves a hole at its own id and
   ; moves nothing. The cost is flash and a regenerated catalogue, not a data migration.
   ;
   ; Enabling it takes the effect count from 157 to 208, and the app's LightSync setup screen has
   ; always offered 2D segments and a pixel layout the firmware could not run.
   ; -D WLED_DISABLE_2D
   -D WLED_DISABLE_PXMAGIC
   -D WLED_DISABLE_ESPNOW
;   -D WLED_DISABLE_BROWNOUT_DET
   -D CLIENT_SSID='""'
   -D CLIENT_PASS='""'
   -D DATA_PINS=16 ;38 for ONBOARD, 16 for external
   -D LED_TYPES=TYPE_WS2812_RGB
   -D DEFAULT_LED_COLOR_ORDER=COL_ORDER_RGB
   -D PIXEL_COUNTS=300
   ; Automatic Brightness Limiter, sized for the 12 V 5 A supply that ships with the
   ; controller. These were 2000 / 30 — WS2812-at-5V numbers, which were wrong twice over:
   ; WLED dimmed after 66 of 300 LEDs at full white, and `BusManager::currentMilliamps()`
   ; is derived from the same per-LED constant, so the estimated current the energy feature
   ; publishes carried a 5 V assumption that the server-side voltage table cannot correct.
   ;
   ; 20 mA/LED at 12 V is derived from the rated strips, not guessed:
   ;   LC8816E   13.4 W/m / 12 V / 60 LED/m = 18.6 mA/LED
   ;   typical 12 V 60 LED/m RGB 14.4 W/m   = 20.0 mA/LED
   ;
   ; 4500 mA is the 5 A supply less headroom for the controller itself — 54 W of 60 W. A
   ; full 5 m run at full white draws more than the supply can give, so the limiter is what
   ; makes the bundle safe by construction rather than by the customer being careful.
   ; Full white across the whole run dims; every other scene is unaffected.
   ;
   ; One figure for both 12 V parts for now. Per-strip values follow when the picker sends
   ; them, and again when the 24 V COB arrives — it is a different number entirely.
   -D ABL_MILLIAMPS_DEFAULT=4500
   -D LED_MILLIAMPS_DEFAULT=20
   -D BTNPIN=-1 -D RLYPIN=-1 -D IRPIN=-1 -D AUDIOPIN=-1
   ; ICS-43434 I2S MEMS mic (generic I2S, no MCLK). UM_AUDIOREACTIVE_ENABLE makes
   ; the audioreactive usermod boot ENABLED so audio effects react to the mic out
   ; of the box (without it the usermod starts disabled and Music Sync does nothing).
   -D SR_DMTYPE=1 -D I2S_SDPIN=6 -D I2S_CKPIN=17 -D I2S_WSPIN=18 -D MCLK_PIN=-1
   -D UM_AUDIOREACTIVE_ENABLE
; Two 3 MB OTA slots + 1.875 MB FS. NOT esp32.large_partitions: that file is shared with every
; other 8 MB env in this fork, and its 2 MB slots leave a ~1.8 MB image almost no headroom.
; A partition table cannot be changed over OTA, so this had to be right before any unit ships.
board_build.partitions = tools/WLED_ESP32_8MB_epixc.csv
board_build.f_flash = 80000000L
board_build.flash_mode = qio
monitor_filters = esp32_exception_decoder
lib_deps = ${esp32s3.lib_deps}

;
; *** To use the below defines/overrides, copy and paste each onto its own line just below build_flags in the section above.
; 
; Set a release name that may be used to distinguish required binary for flashing
;   -D WLED_RELEASE_NAME=\"ESP32_MULTI_USREMODS\"
;
; disable specific features
;   -D WLED_DISABLE_OTA
;   -D WLED_DISABLE_ALEXA
;   -D WLED_DISABLE_HUESYNC
;   -D WLED_DISABLE_LOXONE
;   -D WLED_DISABLE_INFRARED
;   -D WLED_DISABLE_WEBSOCKETS
;   -D WLED_DISABLE_MQTT
;   -D WLED_DISABLE_ADALIGHT
;   -D WLED_DISABLE_2D
;   -D WLED_DISABLE_PXMAGIC
;   -D WLED_DISABLE_ESPNOW
;   -D WLED_DISABLE_BROWNOUT_DET
;
; enable optional built-in features
;   -D WLED_ENABLE_PIXART
;   -D WLED_ENABLE_USERMOD_PAGE # if created
;   -D WLED_ENABLE_DMX
;
; PIN defines - uncomment and change, if needed:
;   -D DATA_PINS=2
; or use this for multiple outputs
;   -D DATA_PINS=1,3
;   -D BTNPIN=0
;   -D IRPIN=4
;   -D RLYPIN=12
;   -D RLYMDE=1
;   -D RLYODRAIN=0
;   -D LED_BUILTIN=2 # GPIO of built-in LED
;
; Limit max buses
;   -D WLED_MAX_BUSSES=2
;   -D WLED_MAX_ANALOG_CHANNELS=3   # only 3 PWM HW pins available
;   -D WLED_MAX_DIGITAL_CHANNELS=2  # only 2 HW accelerated pins available
;
; Configure default WiFi
;   -D CLIENT_SSID='"MyNetwork"'
;   -D CLIENT_PASS='"Netw0rkPassw0rd"'
;
; Configure and use Ethernet
;   -D WLED_USE_ETHERNET
;   -D WLED_ETH_DEFAULT=5
; do not use pins 5, (16,) 17, 18, 19, 21, 22, 23, 25, 26, 27 for anything but ethernet
;   -D PHY_ADDR=0 -D ETH_PHY_POWER=5 -D ETH_PHY_MDC=23 -D ETH_PHY_MDIO=18
;   -D ETH_CLK_MODE=ETH_CLOCK_GPIO17_OUT
;
; NTP time configuration
;   -D WLED_NTP_ENABLED=true
;   -D WLED_TIMEZONE=2
;   -D WLED_LAT=48.86
;   -D WLED_LON=2.33
;
; Use Watchdog timer with 10s guard
;   -D WLED_WATCHDOG_TIMEOUT=10
;
; Create debug build (with remote debug)
;   -D WLED_DEBUG
;   -D WLED_DEBUG_HOST='"192.168.0.100"'
;   -D WLED_DEBUG_PORT=7868
;
; Use Autosave usermod and set it to do save after 90s
;   -D USERMOD_AUTO_SAVE
;   -D AUTOSAVE_AFTER_SEC=90
;
; Use AHT10/AHT15/AHT20 usermod
;   -D USERMOD_AHT10
;
; Use INA226 usermod
;   -D USERMOD_INA226
;
; Use 4 Line Display usermod with SPI display
;   -D USERMOD_FOUR_LINE_DISPLAY
;   -DFLD_SPI_DEFAULT
;   -D FLD_TYPE=SSD1306_SPI64
;   -D FLD_PIN_CLOCKSPI=14
;   -D FLD_PIN_DATASPI=13
;   -D FLD_PIN_DC=26
;   -D FLD_PIN_CS=15
;   -D FLD_PIN_RESET=27
;
; Use Rotary encoder usermod (in conjunction with 4LD)
;   -D USERMOD_ROTARY_ENCODER_UI
;   -D ENCODER_DT_PIN=5
;   -D ENCODER_CLK_PIN=18
;   -D ENCODER_SW_PIN=19
;
; Use Dallas DS18B20 temperature sensor usermod and configure it to use GPIO13
;   -D USERMOD_DALLASTEMPERATURE
;   -D TEMPERATURE_PIN=13
;
; Use Multi Relay usermod and configure it to use 6 relays and appropriate GPIO
;   -D USERMOD_MULTI_RELAY
;   -D MULTI_RELAY_MAX_RELAYS=6
;   -D MULTI_RELAY_PINS=12,23,22,21,24,25
;
; Use PIR sensor usermod and configure it to use GPIO4 and timer of 60s
;   -D USERMOD_PIRSWITCH
;   -D PIR_SENSOR_PIN=4   # use -1 to disable usermod
;   -D PIR_SENSOR_OFF_SEC=60
;   -D PIR_SENSOR_MAX_SENSORS=2 # max allowable sensors (uses OR logic for triggering)
;
; Use Audioreactive usermod and configure I2S microphone
;   ${esp32.AR_build_flags} ;; default flags required to properly configure ArduinoFFT
;   ;; don't forget to add ArduinoFFT to your libs_deps: ${esp32.AR_lib_deps}
;   -D AUDIOPIN=-1
;   -D DMTYPE=1     # 0-analog/disabled, 1-I2S generic, 2-ES7243, 3-SPH0645, 4-I2S+mclk, 5-I2S PDM
;   -D I2S_SDPIN=36
;   -D I2S_WSPIN=23
;   -D I2S_CKPIN=19
;
; Use PWM fan usermod
;   -D USERMOD_PWM_FAN
;   -D TACHO_PIN=33
;   -D PWM_PIN=32
;
;  Use POV Display usermod
;   -D USERMOD_POV_DISPLAY
; Use built-in or custom LED as a status indicator (assumes LED is connected to GPIO16)
;   -D STATUSLED=16
;
; set the name of the module - make sure there is a quote-backslash-quote before the name and a backslash-quote-quote after the name
;   -D SERVERNAME="\"WLED\""
;
; set the number of LEDs
;   -D PIXEL_COUNTS=30
; or this for multiple outputs
;   -D PIXEL_COUNTS=30,30
;
; set the default LED type
;   -D LED_TYPES=22    # see const.h (TYPE_xxxx)
; or this for multiple outputs
;   -D LED_TYPES=TYPE_SK6812_RGBW,TYPE_WS2812_RGB
;
; set default color order of your led strip
;   -D DEFAULT_LED_COLOR_ORDER=COL_ORDER_GRB
;
; set milliampere limit when using ESP power pin (or inadequate PSU) to power LEDs
;   -D ABL_MILLIAMPS_DEFAULT=850
;   -D LED_MILLIAMPS_DEFAULT=55
;
; enable IR by setting remote type
;   -D IRTYPE=0   # 0 Remote disabled | 1 24-key RGB | 2 24-key with CT | 3 40-key blue | 4 40-key RGB | 5 21-key RGB | 6 6-key black | 7 9-key red | 8 JSON remote
;   
; use PSRAM on classic ESP32 rev.1 (rev.3 or above has no issues)
;   -DBOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue   # needed only for classic ESP32 rev.1
;
; configure I2C and SPI interface (for various hardware)
;   -D I2CSDAPIN=33 # initialise interface
;   -D I2CSCLPIN=35 # initialise interface
;   -D HW_PIN_SCL=35
;   -D HW_PIN_SDA=33
;   -D HW_PIN_CLOCKSPI=7
;   -D HW_PIN_DATASPI=11
;   -D HW_PIN_MISOSPI=9

# Bench build. Identical to PixC_V1 except it points the provisioning call at a
# machine on the local network, over plaintext, on the api container's own port.
#
# This exists so the LAN address is not a value sitting in the release build that
# someone has to remember to change back — which is exactly what it was: the
# shipping firmware carried -D PIXC_API_HOST='"192.168.0.12"', a private address
# on somebody's home network.
#
# `pio run -e PixC_V1_dev` for bench work. Releases build PixC_V1 and cannot pick
# this up: default_envs above names only PixC_V1.
[env:PixC_V1_dev]
extends = env:PixC_V1
build_flags = ${env:PixC_V1.build_flags}
  -D PIXC_API_HOST='"192.168.0.12"'
  -D PIXC_API_PORT=8080
