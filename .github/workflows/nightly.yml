
name: Deploy Nightly
on:
  # ePixC, 2026-10-20: manual only. Founder: "I dont want to run github actions all times".
  # Upstream ran this at 02:00 UTC; its jobs are guarded to wled/WLED anyway.
  # This can be used to allow manually triggering nightlies from the web interface
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  wled_build:
    # Upstream WLED only (founder decision 2026-09-25): in this fork it would run upstream's
    # release pipeline, which builds no ePixC image. epixc-firmware.yaml is ours.
    if: github.repository == 'wled/WLED'
    uses: ./.github/workflows/build.yml
  nightly:
    name: Deploy nightly
    runs-on: ubuntu-latest
    needs: wled_build
    if: github.repository == 'wled/WLED'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Show Files
        run: ls -la
      - name: "✏️ Generate release changelog"
        id: changelog
        uses: janheinrichmerker/action-github-changelog-generator@v2.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} 
          sinceTag: v16.0.0
          output: CHANGELOG_NIGHTLY.md
          # Exclude issues that were closed without resolution from changelog
          excludeLabels: 'stale,wontfix,duplicate,invalid,external,question,use-as-is,not_planned'
      - name: Update Nightly Release
        uses: andelf/nightly-release@5834076edc55cc05975561c9722043f072ac5c26
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: nightly
          name: 'Nightly Release $$'
          prerelease: true
          body_path: CHANGELOG_NIGHTLY.md
          files: |
            *.bin
            *.bin.gz
      - name: Repository Dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          repository: wled/WLED-WebInstaller
          event-type: release-nightly
          token: ${{ secrets.PAT_PUBLIC }}
