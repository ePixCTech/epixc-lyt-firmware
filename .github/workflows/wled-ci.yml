name: WLED CI

# Upstream WLED's CI, kept for a manual run only (founder decision 2026-09-25). It builds
# default_envs from platformio_override.ini, which is PixC_V1, the shippable env; that env refuses
# to compile without the OTA signing key, a secret this workflow never receives, so on every push
# it failed for a reason unrelated to the change. The CI that gates this fork is
# epixc-firmware.yaml: it builds PixC_V1_dev when no key is configured and runs the size, CA-root,
# claims and brand checks.
on:
  workflow_dispatch:

jobs:
  wled_build:
    uses: ./.github/workflows/build.yml
